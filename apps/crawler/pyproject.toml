[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "websearch-crawler"
version = "0.1.0"
description = "High-throughput asynchronous web crawler for Web-Search.org"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "pydantic>=2.10.0",
    "urllib3>=2.3.0",
    "rich>=13.9.0",
    "click>=8.1.8"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0"
]

[project.scripts]
websearch-crawler = "crawler.cli:main"
