services:
  # Web & Search Engine UI + REST API (Laravel + Svelte)
  app:
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile
    container_name: websearch_app
    restart: unless-stopped
    working_dir: /var/www/html/apps/web
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:Q3VzdG9tS2V5Rm9yTG9jYWxEZXZlbG9wbWVudDEyMw==
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/apps/web/database/database.sqlite
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis

  # Web Server (Nginx)
  nginx:
    image: nginx:alpine
    container_name: websearch_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./infra/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # High-Throughput Asynchronous Web Crawler Worker
  crawler:
    build:
      context: ./apps/crawler
      dockerfile: Dockerfile
    container_name: websearch_crawler
    restart: unless-stopped
    environment:
      API_ENDPOINT: http://nginx:80/api/v1/crawl/ingest
      PYTHONUNBUFFERED: "1"
    depends_on:
      - nginx
    command: ["run", "--seed", "https://news.ycombinator.com", "--max-pages", "100", "--concurrency", "5", "--api-endpoint", "http://nginx:80/api/v1/crawl/ingest"]

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: websearch_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Fast Search Engine / Vector Store (Meilisearch)
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: websearch_search_engine
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: development
      MEILI_MASTER_KEY: masterKeyForLocalSearchIndex123
    volumes:
      - meili_data:/meili_data

volumes:
  redis_data:
  meili_data:
